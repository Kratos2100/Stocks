[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "options-mas"
version = "0.1.0"
description = "Multi-agent intraday options-buying system for NSE NIFTY/BANKNIFTY (premium-chart strategies)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
parquet = ["pyarrow>=15"]
data = ["requests>=2.31", "nselib>=2.5", "kiteconnect>=5.0", "dhanhq>=2.1", "pyotp>=2.9", "websockets>=12"]

[project.scripts]
options-mas = "options_mas.cli:main"

[tool.setuptools.packages.find]
include = ["options_mas*"]

[tool.setuptools.package-data]
options_mas = ["api/static/*.html", "api/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
